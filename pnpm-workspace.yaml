packages:
  - 'packages/*'
  - 'templates/*'
  - 'templates/nextjs/*'
  - 'templates/vite/*'

nodeLinker: hoisted

# A version is installed only once it has been on the registry for a day: compromised releases are
# usually caught and unpublished within hours, so the delay keeps them out of the lockfile. pnpm
# also re-checks every lockfile entry against the gate on install, so CI rejects a lockfile that
# brings in a younger release, whoever wrote it.
# The cooldown in .github/dependabot.yml has to stay at least as long: Dependabot picks a version
# without looking at this gate and would otherwise propose one that pnpm refuses to install.
# An urgent fix that cannot wait a day is listed below as `<name>@<version>` until it turns a day old.
minimumReleaseAge: 1440
# Fail rather than fall back to a younger version when no release in the range is old enough.
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  # Our own packages are published by us and are taken without the delay.
  - '@koobiq/*'

# Build scripts of dependencies run only when they are listed here: an install script is how a
# compromised package usually runs its payload, and pnpm fails the install on an unlisted one.
allowBuilds:
  # Both load a prebuilt native binary from their optional platform package, so the script that
  # only verifies or downloads it is not needed.
  esbuild: false
  unrs-resolver: false

overrides:
  react: '^19.0.0'
  react-dom: '^19.0.0'
  '@types/react-dom': '^19.0.0'
  '@types/react': '^19.0.0'
  storybook: '$storybook'
  react-docgen-typescript: '2.2.2'
  '@babel/core': '^7.29.6'
  'brace-expansion@1': '^1.1.16'
  'brace-expansion@5': '^5.0.7'
  'esbuild@0.27': '^0.28.2'
  fast-uri: '^3.1.6'
  form-data: '^4.0.6'
  js-yaml: '^4.3.2'
  'minimatch@3': '^3.1.3'
  postcss: '^8.5.23'
  postcss-selector-parser: '^7.1.3'
  sharp: '^0.35.0'
  undici: '^7.29.1'
  ws: '^8.21.0'
