version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    # A release is proposed only once it is a week old, so a compromised version is caught
    # before it reaches a pull request.
    cooldown:
      default-days: 7
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    # Has to stay at least as long as minimumReleaseAge in pnpm-workspace.yaml: Dependabot does not
    # read the gate when it picks a version, and pnpm refuses to install a younger one. The same
    # window also holds back the transitive dependencies Dependabot resolves into the lockfile.
    # Security updates are not delayed, so their CI fails the lockfile check until the fix is a day
    # old. Our own packages are taken as soon as they are published.
    cooldown:
      default-days: 7
      exclude:
        - '@koobiq/*'
    ignore:
      # Ignores any major updates
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      react-aria:
        patterns:
          - 'react-aria'
          - 'react-aria-components'
          - '@react-aria/*'
          - '@react-stately/*'
          - '@react-types/*'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'globals'
      prettier:
        patterns:
          - 'prettier*'
      stylelint:
        patterns:
          - 'stylelint*'
      storybook:
        patterns:
          - 'storybook*'
          - '@storybook/*'
          - '@chromatic-com/storybook*'
          - '@vueless/storybook-*'
      testing:
        patterns:
          - 'vitest*'
          - '@vitest/*'
          - '@testing-library/*'
          - 'jsdom'
      vite:
        patterns:
          - 'vite'
          - 'vite-*'
          - '@vitejs/*'
      react:
        patterns:
          - 'react*'
          - '@types/react*'
      commitlint:
        patterns:
          - '@commitlint/*'
      svgr:
        patterns:
          - '@svgr/*'
      figma:
        patterns:
          - '@figma-export/*'
      postcss:
        patterns:
          - 'postcss*'
      koobiq:
        patterns:
          - '@koobiq/*'
