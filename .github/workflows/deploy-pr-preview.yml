name: Deploy PR Preview Docs

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  checks: write # create the "Deploy Preview" check run (action-hosting-deploy)
  contents: read # clone the repository (actions/checkout)
  pull-requests: write # comment on the PR with the preview URL (action-hosting-deploy)

jobs:
  deploy-pr-preview:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Build Storybook
        run: pnpm run build-storybook

      - name: Deploy Preview
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KOOBIQ }}
          firebaseToolsVersion: '15.22.3'
          projectId: koobiq
          target: next
          channelId: prs-${{ github.event.number }}
          expires: 5d
