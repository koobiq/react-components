name: API

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read # clone the repository (actions/checkout)

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Build packages
        run: pnpm run build
      - name: Check public API
        run: pnpm run check-api
      - name: Check the Claude Code plugin against the build
        run: node --test plugins/koobiq/scripts/tests/real.test.mjs
        env:
          KOOBIQ_DS_DIR: packages/components
