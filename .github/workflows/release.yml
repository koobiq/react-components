name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write # clone the repository and create the GitHub release (upload-release-action)

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'koobiq' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Build Packages
        run: pnpm run build

      - name: Configure NPM Auth
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_PUBLISH_TOKEN }}" > ~/.npmrc

      - name: Publish Packages to NPM
        run: pnpm run release:publish --no-git-checks

      - name: Parse Changelog
        id: changelog
        uses: ocavue/changelog-parser-action@0260f7a77c97ed295575683c8036b81724fd34f5 # v1.2.0
        with:
          removeMarkdown: false
          filePath: './CHANGELOG.md'

      - name: Upload Binaries to Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.changelog.outputs.latestVersion }}
          file: ./
          body: |
            ${{ steps.changelog.outputs.latestBody }}

      - name: Notify Mattermost
        uses: mattermost/action-mattermost-notify@ae31bb6f9e26a54336e79696f108a2c91cf55b4e # v2.1.0
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
          MATTERMOST_CHANNEL: ${{ secrets.MM_CHANNEL_NAME }}
          MATTERMOST_USERNAME: ${{ secrets.MM_BOT_NAME }}
          TEXT: |
            ## ${{ steps.changelog.outputs.latestVersion }}

            ${{ steps.changelog.outputs.latestBody }}
