name: E2E tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read # for actions/checkout to read the repository
  pull-requests: write # for thollander/actions-comment-pull-request to comment on a failure

jobs:
  # Runs in the tools/e2e container on its platform, linux/arm64, which the baselines belong to.
  e2e_tests:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: run-e2e-tests
        run: node tools/e2e/run.mjs --workers=100%
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        id: upload-report
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5
      - uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        if: ${{ failure() && steps.run-e2e-tests.outcome == 'failure' && github.event_name == 'pull_request' }}
        with:
          message: |
            ### 🚨 E2E tests failed

            Review the [report](${{ steps.upload-report.outputs.artifact-url }}) for details.

            ---

            💡 Comment `/approve-snapshots` to approve snapshot changes.
